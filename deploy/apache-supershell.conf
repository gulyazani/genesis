# Yalnızca supershell.click. Diğer cPanel sitelerine dokunma.
# Apache'yi DURDURMA. Bu vhost 80'de sadece bu domain'i 43127'ye yollar.
#
# WHM / root: dosyayı kopyala ve httpd'yi reload et
#   sudo cp deploy/apache-supershell.conf /etc/apache2/conf.d/supershell.conf
#   # veya /etc/httpd/conf.d/supershell.conf
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# Proxy modülleri: proxy, proxy_http (EasyApache'de aç)

<VirtualHost *:80>
	ServerName supershell.click
	ServerAlias www.supershell.click
	ProxyPreserveHost On
	ProxyPass / http://127.0.0.1:43127/
	ProxyPassReverse / http://127.0.0.1:43127/
</VirtualHost>
